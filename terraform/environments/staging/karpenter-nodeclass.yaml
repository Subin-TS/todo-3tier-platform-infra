apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest

  role: todo-staging-karpenter-node-role

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: todo-staging

  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/todo-staging: owned

  tags:
    karpenter.sh/discovery: todo-staging
    Name: todo-staging-karpenter-node
